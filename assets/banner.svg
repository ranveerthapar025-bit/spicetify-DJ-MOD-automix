<style>
  .b { transform-box: fill-box; transform-origin: 50% 50%; animation: beat 0.5s ease-in-out infinite alternate; }
  .b1 { animation-delay: -0.1s; } .b2 { animation-delay: -0.2s; } .b3 { animation-delay: -0.3s; } .b4 { animation-delay: -0.4s; }
  @keyframes beat { from { transform: scaleY(1); } to { transform: scaleY(0.62); } }
  .sweep { animation: sweep 9s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1152px); } }
  .zone { animation: zone 1s ease-in-out infinite alternate; }
  @keyframes zone { from { fill-opacity: 0.04; } to { fill-opacity: 0.11; } }
  .dot { animation: dot 1s ease-in-out infinite alternate; }
  @keyframes dot { from { opacity: 0.55; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .b, .zone, .dot { animation: none; } .sweep { display: none; } }
</style>
